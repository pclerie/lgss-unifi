name: lgss-unifi
adopt-info: unifi
license: BSD-3-Clause
title: Unifi Network Application
summary: Unifi Network controller software.
description: |
  Unofficial snap package of the Unifi Network Application software.

  Ubiquiti UniFi server is a centralized management system for UniFi suite of
  devices. After the UniFi server is installed, the UniFi Network application
  can be accessed on any web browser. The UniFi Network application allows the
  operator to instantly provision thousands of UniFi devices, map out network
  topology, quickly manage system traffic, and further provision individual
  UniFi devices.
base: core24
source-code: https://github.com/pclerie/lgss-unifi
issues: https://github.com/pclerie/lgss-unifi/issues
website: https://github.com/pclerie/lgss-unifi
contact: https://github.com/pclerie/lgss-unifi/issues
confinement: strict
grade: stable
platforms:
  amd64:
  arm64:
    build-on: arm64
    build-for: arm64

package-repositories:
  - type: apt
    components: [ubiquiti]
    suites: [stable]
    key-id: 4A228B2D358A5094178285BE06E85760C0A52C50
    url: https://dl.ui.com/unifi/debian

  - type: apt
    components: [multiverse]
    suites: [noble/mongodb-org/8.0]
    key-id: 4B0752C1BCA238C0B4EE14DC41DE058A4E7DCA05
    url: https://repo.mongodb.org/apt/ubuntu

layout:
   /usr/lib/unifi/bin:
     bind: $SNAP/usr/lib/unifi/bin
   /usr/lib/unifi/dl:
     bind: $SNAP/usr/lib/unifi/dl
   /usr/lib/unifi/lib:
     bind: $SNAP/usr/lib/unifi/lib
   /usr/lib/unifi/webapps:
     bind: $SNAP/usr/lib/unifi/webapps
   /usr/lib/unifi/data:
     bind: $SNAP_DATA/data
   /usr/lib/unifi/run:
     bind: $SNAP_DATA/run
   /usr/lib/unifi/logs:
     bind: $SNAP_DATA/logs
   /usr/lib/unifi/work:
     bind: $SNAP_DATA/work

apps:
  unifi:
    command: bin/launcher.sh
    daemon: simple
    plugs:
      - mount-observe
      - network
      - network-bind
      - network-observe

  deploy-certificate:
    command: bin/unifi_deploy_certificate.sh
    plugs:
      - network

parts:
  unifi:
    plugin: nil
    build-packages:
      - ca-certificates-java
    stage-packages:
      - openjdk-25-jre-headless
      - unifi
    override-build: |
      snapcraftctl build
      VER="$(cat $SNAPCRAFT_PART_INSTALL/usr/lib/unifi/webapps/ROOT/app-unifi/.version | \
           sed 's/-.*$//')"
      snapcraftctl set-version $VER
    override-prime: |
      snapcraftctl prime
      rm -f usr/lib/jvm/java-25-openjdk-*/lib/security/cacerts
      ln -sf /snap/$SNAPCRAFT_PROJECT_NAME/current/usr/bin/mongod \
        $SNAPCRAFT_PRIME/usr/lib/unifi/bin/mongod

  launcher:
    plugin: dump
    source-type: file
    source: scripts/launcher.sh
    organize:
      launcher.sh: bin/launcher.sh

  deploy-certificate:
    plugin: dump
    source-type: file
    source: scripts/unifi_deploy_certificate.sh
    organize:
      unifi_deploy_certificate.sh: bin/unifi_deploy_certificate.sh
